<title>STAYOS - Links</title>
<style>
:root{--bg:#07060c;--card:#14111f;--gold:#ffc24a;--cyan:#40d6d6;--mag:#ff3bd4;--txt:#fff4e1}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:radial-gradient(circle at 50% 0,#2a1840 0,var(--bg) 60%);color:var(--txt);
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{width:100%;max-width:460px;margin:0 auto;padding:36px 16px 48px;text-align:center}
.logo{width:220px;max-width:70%;margin:6px auto 6px;display:block;filter:drop-shadow(0 0 18px rgba(255,194,74,.45))}
.tag{color:var(--cyan);letter-spacing:.12em;font-size:11px;text-transform:uppercase;margin:0 0 26px;line-height:1.6}
.btn.card{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px 10px 10px}
.card img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none}
.card b{display:block;font-size:15px;line-height:1.3}
h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:28px 0 12px}
.btn{display:block;margin:10px 0;padding:15px 18px;border-radius:14px;background:var(--card);color:var(--txt);
text-decoration:none;font-weight:600;border:1px solid rgba(255,194,74,.35);box-shadow:0 0 0 1px rgba(64,214,214,.08) inset}
.btn:hover{border-color:var(--mag)}
.btn.event{background:linear-gradient(135deg,#ff3bd4,#ffc24a);color:#14060f;border:0;font-size:19px;font-weight:800;
letter-spacing:.04em;padding:18px;box-shadow:0 6px 28px rgba(255,59,212,.35);margin:0 0 6px}
.btn.event .sub{opacity:.85;font-weight:600;color:#2a0f22}
.btn.prof{display:flex;align-items:center;gap:12px;padding:14px 18px}
.btn.prof .ico{flex:none}.btn.prof .lbl{flex:1;text-align:center;margin-right:34px}
.card .sub{display:flex;align-items:center;gap:6px}.card .sub .ico{flex:none}.sub{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:3px}
footer{margin-top:34px;font-size:11px;opacity:.5}
